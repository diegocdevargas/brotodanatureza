            - heading "Usos medicinais" [level=2] [ref=f6e64]
            - paragraph [ref=f6e65]: Usado na melhora do comprometimento cognitivo associado à idade e da qualidade de vida na demência leve. Usado tradicionalmente no alívio da sensação de peso nas pernas e de mãos e pés frios associados a distúrbios circulatórios leves, depois que um médico descartar causas mais graves.
          - generic [ref=f6e66]:
            - heading "Partes utilizadas" [level=2] [ref=f6e67]
            - list [ref=f6e68]:
              - listitem [ref=f6e69]:
                - generic [ref=f6e73]: Folhas
          - generic [ref=f6e74]:
            - heading "Modo de preparo" [level=2] [ref=f6e79]
            - paragraph [ref=f6e80]: "Somente em extratos padronizados, para adultos e idosos. Uso cognitivo: 120 a 240 mg por dose, dose diária de 240 mg, por pelo menos 8 semanas; se não houver melhora em 3 meses, o médico deve reavaliar. Uso tradicional (circulação): 250 a 360 mg por dose, até 750 mg ao dia; se persistir por mais de 2 semanas, procurar um profissional de saúde."
          - note [ref=f6e81]:
            - heading "Contraindicações" [level=2] [ref=f6e86]
            - paragraph [ref=f6e87]: "Contraindicado na gravidez e em caso de hipersensibilidade. Pode aumentar o risco de sangramento: quem usa anticoagulantes (como varfarina) ou antiplaquetários (como AAS e clopidogrel) só deve usar com orientação médica, e o produto deve ser suspenso 3 a 4 dias antes de cirurgias. Pode favorecer convulsões em pessoas com epilepsia. Não usar com efavirenz; cautela com nifedipina. Não recomendado para menores de 18 anos."
